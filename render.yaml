databases:
  - name: airfare-index-db
    plan: free
    databaseName: airfare_index
    user: airfare_index

services:
  - type: web
    name: airfare-index-api
    runtime: python
    plan: free
    rootDir: Backend
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: airfare-index-db
          property: connectionString
      - key: API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.15
